<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Art 模型设置页(插件自绘,cindy-ghost:// 沙箱页)。
     复现 Host 在 #6073 前提供的 Cindy 能力卡片：四项能力逐项选模，
     配置写入 Art 自己的 /kv，主逻辑按能力读取。 -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    padding: 0;
    color: var(--text-primary);
    font-size: 13px; line-height: 1.5;
    --settings-input-bg: var(--surface-elevated);
    --settings-input-border: var(--border-default);
    --settings-input-text: var(--text-primary);
    --model-trigger-text: var(--text-secondary);
    --model-dropdown-bg: var(--surface-elevated);
    --model-dropdown-border: var(--border-default);
    --model-item-text: var(--text-primary);
    --model-item-hover: light-dark(#EFEFEA, #2B2B2B);
    --model-item-check: light-dark(#3C3F43, #EEEEEE);
    --focus-ring-soft: color-mix(in srgb, var(--focus-ring) 50%, transparent);
    --shadow-menu: 0 4px 16px light-dark(rgba(0, 0, 0, .15), rgba(0, 0, 0, .5));
  }
  button { font: inherit; }
  .capability-card {
    display: flex; flex-direction: column; gap: 12px;
    min-width: 0; max-width: 100%; padding: 16px 20px; border-radius: 12px;
    border: 1px solid color-mix(in srgb, var(--border-default, #e4e4e0) 72%, transparent);
    background: color-mix(in srgb, var(--surface-elevated, #fdfdf8) 82%, var(--surface, #f2f2ed));
  }
  .card-head { display: flex; align-items: center; gap: 8px; }
  #card-icon { display: flex; flex: none; color: var(--text-tertiary); }
  .card-title { font-size: 14px; line-height: 1.571; font-weight: 500; }
  .card-desc { color: var(--text-tertiary, #8a8a86); font-size: 13px; line-height: 20px; }
  #capabilities { display: flex; flex-direction: column; gap: 12px; }
  .cap-row {
    display: flex; min-width: 0; align-items: center;
    justify-content: space-between; gap: 16px;
  }
  .cap-label {
    min-width: 0; color: var(--text-secondary, #888883);
    font-size: 13px; line-height: 20px;
  }

  .model-picker { position: relative; flex: 0 1 300px; min-width: 0; max-width: 60%; }
  .model-trigger {
    display: flex; width: 100%; height: 32px; align-items: center; gap: 8px;
    padding: 0 10px 0 12px;
    border: 1px solid var(--settings-input-border, #deded8); border-radius: 999px;
    background: var(--settings-input-bg, #fdfdf8);
    color: var(--settings-input-text, #1a1a1a);
    font-size: 13px; cursor: pointer; outline: none;
  }
  .model-trigger:focus { box-shadow: 0 0 0 2px var(--focus-ring-soft); }
  .model-trigger .model-name {
    min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; text-align: left;
  }
  .model-trigger .chevron { width: 13px; height: 13px; flex: none; color: var(--text-tertiary, #8a8a86); }
  .provider-mark {
    flex: none; color: var(--model-trigger-text);
  }
  .provider-monogram {
    display: flex; align-items: center; justify-content: center;
    width: 14.2px; height: 14.2px; border: 1px solid currentColor; border-radius: 4px;
    font-size: 10px; font-weight: 600; line-height: 1;
  }

  .model-popover {
    position: absolute; top: 38px; right: 0; z-index: 30; width: 300px;
    max-width: calc(100vw - 48px); padding: 4px;
    border: 1px solid var(--model-dropdown-border, #e4e4df); border-radius: 12px;
    background: var(--model-dropdown-bg, #fdfdf8);
    box-shadow: var(--shadow-menu); overflow: hidden; outline: none; display: none;
  }
  .model-popover.open { display: block; }
  .model-list { max-height: 300px; overflow-y: auto; }
  .model-option {
    display: flex; width: 100%; align-items: center; gap: 8px; padding: 8px 12px;
    border: 0; border-radius: 8px; background: transparent;
    color: var(--model-item-text, #1a1a1a);
    font-size: 13px; line-height: 20px; text-align: left; cursor: pointer;
    transition: background-color var(--motion-fast) var(--motion-ease-out);
  }
  .model-option:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--focus-ring); }
  .model-option:hover, .model-option[aria-selected='true'] {
    background: var(--model-item-hover, #f0f0eb);
  }
  .model-option .option-label {
    min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .model-option .check { width: 15px; height: 15px; flex: none; color: var(--model-item-check, #1a1a1a); }
  .no-models {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--text-tertiary, #8a8a86); font-size: 13px; line-height: 20px;
  }
  #status {
    min-height: 16px; margin: 6px 2px 0;
    color: var(--text-tertiary, #8a8a86); font-size: 11px; line-height: 16px;
    text-align: right;
  }
  #status.is-error { color: var(--error-fg, #b3403c); }
  #status:empty { display: none; }
</style>
</head>
<body>
  <section class="capability-card" id="capability-card" aria-label="Cindy abilities">
    <div class="card-head">
      <span id="card-icon" aria-hidden="true"></span>
      <p class="card-title" id="card-title">Cindy abilities</p>
    </div>
    <p class="card-desc" id="card-desc">Choose a model for image generation, image editing, video generation and image-to-video. These settings are saved in the Art plugin.</p>
    <div id="capabilities"></div>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
<script src="settings-icons.js"></script>
<script src="settings.js"></script>
</body>
</html>
