name: Verify pull request

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Repository-wide gates
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check per-plugin tracked binary totals
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD^2)" = "${HEAD_SHA}"
          node .github/scripts/check-source-size.mjs "$(git rev-parse HEAD^1)"

      - name: Validate official plugin publish contract
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Event base.sha can lag behind the checked-out PR merge commit.
          test "$(git rev-parse HEAD^2)" = "${HEAD_SHA}"
          export BASE_SHA="$(git rev-parse HEAD^1)"
          node --test .tests/plugin-contract.test.mjs

      - name: Validate plugin localization resources
        run: node --test .tests/localization.test.mjs

      - name: Validate provisioning registrations
        run: node --test .tests/provisioning.test.mjs

      - name: Validate publish workflows
        run: node --test .tests/publish-workflows.test.mjs

      - name: Validate binary dependency packaging
        run: node --test .tests/binary-dependencies.test.mjs

  changed-plugins:
    name: Test and dry-run packaging for changed plugins
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.draft == false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed plugin directories
        id: changes
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Use both parents of the checked-out merge, not event base.sha.
          test "$(git rev-parse HEAD^2)" = "${HEAD_SHA}"
          BASE_SHA="$(git rev-parse HEAD^1)"
          git ls-tree -r --name-only HEAD \
            | sed -n 's|/ghost\.json$||p' | sort -u > "${RUNNER_TEMP}/plugin-roots"
          git diff --name-only --no-renames --diff-filter=AMD "${BASE_SHA}" HEAD \
            > "${RUNNER_TEMP}/changed-files"
          if grep -Eq '^(LICENSE|NOTICE|TRADEMARKS\.md|TRADEMARKS\.zh-CN\.md)$' \
            "${RUNNER_TEMP}/changed-files"; then
            changed="$(cat "${RUNNER_TEMP}/plugin-roots")"
          else
            changed="$(
              awk '
                NR == FNR { roots[$0] = 1; next }
                {
                  for (root in roots) {
                    if ($0 == root || index($0, root "/") == 1) {
                      print root
                      break
                    }
                  }
                }
              ' "${RUNNER_TEMP}/plugin-roots" "${RUNNER_TEMP}/changed-files" | sort -u
            )"
          fi
          if [[ -z "${changed}" ]]; then
            echo "plugins=[]" >> "${GITHUB_OUTPUT}"
          else
            printf '%s\n' "${changed}" | jq -R -s -c 'split("\n")[:-1] | map({directory: .})' \
              | sed 's/^/plugins=/' >> "${GITHUB_OUTPUT}"
          fi

      - name: Run plugin tests (installing per-plugin dependencies first)
        if: ${{ steps.changes.outputs.plugins != '[]' }}
        env:
          PLUGINS: ${{ steps.changes.outputs.plugins }}
        run: |
          set -euo pipefail
          failed=0
          for directory in $(jq -r '.[].directory' <<<"${PLUGINS}"); do
            if [[ -f "${directory}/package.json" ]]; then
              echo "::group::npm ci (${directory})"
              npm ci --prefix "${directory}"
              echo "::endgroup::"
            fi
            test_file=".tests/${directory}.test.mjs"
            if [[ -f "${test_file}" ]]; then
              echo "::group::node --test ${test_file}"
              node --test "${test_file}" || failed=1
              echo "::endgroup::"
            else
              # Make the skip visible instead of leaving a green step that ran
              # zero plugin tests.
              echo "::notice::no runnable .tests/${directory}.test.mjs — plugin-specific tests skipped for ${directory}"
            fi
          done
          exit "${failed}"

      - name: Dry-run plugin packaging
        id: packages
        if: ${{ steps.changes.outputs.plugins != '[]' }}
        env:
          PLUGINS: ${{ steps.changes.outputs.plugins }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          artifact_dir="$(mktemp -d "${RUNNER_TEMP}/pr-plugins.XXXXXX")"
          test "$(git rev-parse HEAD^2)" = "${HEAD_SHA}"
          for directory in $(jq -r '.[].directory' <<<"${PLUGINS}"); do
            echo "::group::Package ${directory}"
            package_dir="${artifact_dir}/${directory}"
            mkdir -p "${package_dir}"
            package="${package_dir}/plugin.cindy"
            .github/scripts/package-plugin.sh "${directory}" "${package}"
            unzip -l "${package}"
            # git archive places the plugin directory's contents at the zip
            # root (HEAD:<dir>), alongside the --add-file'd root documents.
            for required in LICENSE NOTICE TRADEMARKS.md TRADEMARKS.zh-CN.md ghost.json; do
              # `unzip -Z1` prints bare entry names and exits 0 regardless of
              # the consumer, so an early-closing grep under pipefail cannot
              # turn a complete package into a false "missing file" failure.
              entries="$(unzip -Z1 "${package}")"
              grep -q "^${required}\$" <<<"${entries}" || {
                echo "::error::${package} is missing ${required}"
                exit 1
              }
            done
            (cd "${package_dir}" && sha256sum plugin.cindy > plugin.cindy.sha256)
            jq -n --arg directory "${directory}" --arg head "${HEAD_SHA}" \
              --arg base "$(git rev-parse HEAD^1)" --arg merge "$(git rev-parse HEAD)" \
              '{pluginDirectory: $directory, prHeadSha: $head, baseSha: $base, buildCommit: $merge}' \
              > "${package_dir}/source.json"
            echo "::endgroup::"
          done
          echo "directory=${artifact_dir}" >> "${GITHUB_OUTPUT}"

      # Available even when the following manual-attestation gate is pending.
      # Test artifacts are never consumed by the production publishers.
      - name: Upload PR verification packages
        if: ${{ steps.changes.outputs.plugins != '[]' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-plugins-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.packages.outputs.directory }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Require Cindy device verification attestation
        if: ${{ steps.changes.outputs.plugins != '[]' }}
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          association="${AUTHOR_ASSOCIATION:-$(jq -r '.pull_request.author_association // empty' "${GITHUB_EVENT_PATH}")}"
          login="${AUTHOR_LOGIN:-$(jq -r '.pull_request.user.login // empty' "${GITHUB_EVENT_PATH}")}"
          skip=0
          case "${association}" in
            OWNER|MEMBER|COLLABORATOR) skip=1 ;;
          esac
          # GitHub logins are case-insensitive; zqchris is a known maintainer.
          if [[ "${login,,}" == "zqchris" ]]; then
            skip=1
          fi
          if [[ "${skip}" -eq 1 ]]; then
            echo "::notice::Skipping Cindy device verification checkbox for maintainer ${login} (author_association=${association})."
            exit 0
          fi
          pr_body="$(jq -r '.pull_request.body // ""' "${GITHUB_EVENT_PATH}")"
          # Keep accepting the stricter stable-only attestation on existing PRs.
          if ! grep -Eq '^- \[[xX]\] \*\*(Cindy device verification / Cindy 实机验证|Production Cindy verification / 生产版 Cindy 验证)\*\*' \
            <<<"${pr_body}"; then
            msg="Cindy device verification / Cindy 实机验证 is not checked yet. This is the ONLY remaining gate if every earlier step is green — it is an expected intermediate state, not a code failure. / 实机验证项尚未勾选；若前面步骤都是绿的，这是唯一剩余门禁，属于预期中间状态，不是代码错误。"
            echo "::error title=Cindy 实机验证 not checked / 实机验证未勾选::${msg}"
            {
              echo "## ⏳ Cindy device verification pending / 等待实机验证"
              echo
              echo "${msg}"
              echo
              echo "1. Download the test package from this run's **Artifacts** (\`pr-plugins-…\`, kept 7 days). / 从本次 run 的 Artifacts 下载测试包（保留 7 天）。"
              echo "2. Install it on a real device running a stable production or Beta Cindy build (Dev/local builds do not qualify; version ≥ the plugin's minCindyVersion). / 在正式稳定版或 Beta 版 Cindy 实机上安装（Dev/本地构建不算；版本不低于 minCindyVersion）。"
              echo "3. Record run/artifact URL, buildCommit, package SHA-256, Cindy version + channel under **Verification / 验证** in the PR body. / 在 PR 描述的验证一节记录 run 链接、buildCommit、包 SHA-256、Cindy 版本与渠道。"
              echo "4. Check \`- [x] **Cindy device verification / Cindy 实机验证**\`. Editing the PR body re-runs this check automatically. / 勾选该项；编辑 PR 描述会自动重跑检查。"
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi
