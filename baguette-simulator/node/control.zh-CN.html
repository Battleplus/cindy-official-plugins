<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baguette 模拟器</title>
<link rel="stylesheet" href="/control.css">
<header><strong>Baguette</strong><span id="status" role="status">正在检查设备…</span><label>画面大小 <select id="zoom" aria-label="画面大小"><option value="0.5">50%</option><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></label><button id="release">解除卡键</button><button id="recover">恢复画面</button><button id="shutdown" class="danger">关闭设备</button></header><div class="hint">关闭设备会结束 App 和连接，保留数据。 <span id="idle"></span></div><section class="devices" aria-label="测试设备"><div class="device-row"><label class="device-picker">测试设备<select id="device-select"></select></label><button id="device-switch" disabled>切换</button><button id="device-add" disabled>添加设备</button><button id="device-edit" disabled>编辑名称</button></div><p id="device-context"></p><p id="device-progress" role="status"></p></section>
<dialog id="device-dialog" aria-labelledby="device-dialog-title"><form id="device-form"><h2 id="device-dialog-title"></h2><p id="device-explanation"></p><label>设备名称<input id="device-name" maxlength="80" required autocomplete="off"></label><div id="device-options"><label>机型<select id="device-model" required></select></label><label>iOS 版本<select id="device-runtime" required></select></label></div><p id="device-error" role="alert"></p><div class="dialog-actions"><button type="button" id="device-new-model">以其他机型新建</button><button type="button" id="device-cancel">取消</button><button type="submit" id="device-save"></button></div></form></dialog>
<div id="notice" role="status"></div><div id="viewport"><div id="stage"><iframe id="screen" title="iOS 模拟器" allow="clipboard-read; clipboard-write"></iframe></div></div>
<script src="/control.js"></script><script src="/devices.js"></script></html>
