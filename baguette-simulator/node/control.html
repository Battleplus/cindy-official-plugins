<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baguette Simulator</title>
<link rel="stylesheet" href="/control.css">
<header><strong>Baguette</strong><span id="status" role="status">Checking device…</span><label>View size <select id="zoom" aria-label="View size"><option value="0.5">50%</option><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></label><button id="release">Release keys</button><button id="recover">Recover view</button><button id="shutdown" class="danger">Shut down device</button></header><div class="hint">Shutdown ends apps and connections. Device data is kept. <span id="idle"></span></div><section class="devices" aria-label="Test devices"><div class="device-row"><label class="device-picker">Test device<select id="device-select"></select></label><button id="device-switch" disabled>Switch</button><button id="device-add" disabled>Add device</button><button id="device-edit" disabled>Edit name</button></div><p id="device-context"></p><p id="device-progress" role="status"></p></section>
<dialog id="device-dialog" aria-labelledby="device-dialog-title"><form id="device-form"><h2 id="device-dialog-title"></h2><p id="device-explanation"></p><label>Device name<input id="device-name" maxlength="80" required autocomplete="off"></label><div id="device-options"><label>Model<select id="device-model" required></select></label><label>iOS version<select id="device-runtime" required></select></label></div><p id="device-error" role="alert"></p><div class="dialog-actions"><button type="button" id="device-new-model">Create with another model</button><button type="button" id="device-cancel">Cancel</button><button type="submit" id="device-save"></button></div></form></dialog>
<div id="notice" role="status"></div><div id="viewport"><div id="stage"><iframe id="screen" title="iOS Simulator" allow="clipboard-read; clipboard-write"></iframe></div></div>
<script src="/control.js"></script><script src="/devices.js"></script></html>
