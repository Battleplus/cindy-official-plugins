<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/settings.css">
<body><main>
  <div class="heading"><div><h2 data-i18n="title"></h2><p data-i18n="intro"></p></div><button id="refresh" data-i18n="refresh"></button></div>
  <section class="permit"><div><label for="enabled" data-i18n="allow"></label><p data-i18n="allowHint"></p></div><input id="enabled" type="checkbox" role="switch" disabled></section>
  <div id="runtime" class="status" role="status" aria-live="polite"></div>
  <section><label for="idle" data-i18n="idle"></label><select id="idle" disabled><option value="15" data-i18n="m15"></option><option value="30" data-i18n="m30"></option><option value="60" data-i18n="m60"></option><option value="0" data-i18n="manual"></option></select><p data-i18n="idleHint"></p></section>
  <div class="heading"><h3 data-i18n="devices"></h3><button id="stop-all" class="danger" data-i18n="stopAll" disabled></button></div>
  <div id="devices"></div><p id="message" role="status" aria-live="polite"></p>
  <p class="footnote" data-i18n="stopHint"></p>
  <details><summary data-i18n="viewerTitle"></summary><p data-i18n="viewerHint"></p></details>
</main><script src="/settings.js"></script></body></html>
